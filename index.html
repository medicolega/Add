<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="mobile-web-app-capable" content="yes">
<title>Z Medicine — Psychiatry Chart Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --surface:#141F35; --surface-2:#1B2A47;
  --line: rgba(232,237,247,0.10); --ink:#EDF1FA; --ink-dim:#8B98B8;
  --cyan:#29B6F6; --cyan-dim: rgba(41,182,246,0.18);
  --green:#22C55E; --green-dim: rgba(34,197,94,0.16);
  --red:#EF4444; --red-dim: rgba(239,68,68,0.16);
  --gold:#F5B942; --radius: 16px; --radius-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{
  font-family:'IBM Plex Sans',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse 900px 600px at 10% -10%, rgba(41,182,246,0.16), transparent 60%),
    radial-gradient(ellipse 1000px 700px at 105% 110%, rgba(27,42,71,0.9), transparent 55%),
    var(--bg);
  min-height:100vh; min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
button, .cat-card, .topic-card, .opt-row, a{ touch-action:manipulation; -webkit-user-select:none; user-select:none; }
input[type=range]{ touch-action:pan-x; }
@supports not (backdrop-filter: blur(1px)){
  .app-header{ background:rgba(11,18,32,0.97); }
}
.heading{font-family:'Calibri','Sora','Poppins',sans-serif; font-weight:700; color:#fff;}
.mono{font-family:'IBM Plex Mono',monospace;}
.wrap{max-width:760px;margin:0 auto;}
button{font-family:inherit; cursor:pointer;}
.screen{display:none;}
.screen.active{display:block;}

/* ---- Sticky header ---- */
.app-header{position:sticky; top:0; z-index:20; background:rgba(11,18,32,0.86); backdrop-filter:blur(14px); border-bottom:1px solid var(--line);}
.header-row{display:flex; align-items:center; justify-content:space-between; padding:10px 18px 8px; max-width:760px; margin:0 auto;}
.brand{display:flex; align-items:center; gap:10px;}
.home-btn{width:28px;height:28px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;}
.home-btn:hover{color:var(--ink); border-color:var(--cyan);}
.home-btn svg{width:16px;height:16px;}
.wordmark{font-family:'Sora','Poppins',sans-serif; font-size:19px; font-weight:700; letter-spacing:0; white-space:nowrap;}
.wordmark .z{color:var(--cyan);}
.wordmark .med{color:var(--ink);}
.header-counter{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-dim);}
.progress-track{height:4px; background:var(--surface-2); width:100%;}
.progress-fill{height:100%; background:var(--cyan); width:0%; transition:width .25s ease;}
.subheader-row{display:none; align-items:center; justify-content:space-between; padding:8px 18px 0; max-width:760px; margin:0 auto;}
.subheader-row.active{display:flex;}
.q-of-total{font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700; letter-spacing:1.5px; color:var(--ink-dim); text-transform:uppercase;}
.score-pill{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--gold); background:var(--surface); border:1px solid var(--line); padding:5px 12px; border-radius:999px;}

.main-content{padding:20px 18px 60px;}

/* ---- cards shared ---- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px;}

/* ---- Level 1: category screen ---- */
.hero{padding:6px 0 20px;}
.hero h1{font-size:24px; margin-bottom:6px;}
.hero p{color:var(--ink-dim); font-size:14px;}
.cat-grid{display:flex; flex-direction:column; gap:12px;}
.cat-card{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; transition:.15s; text-align:left; width:100%;}
.cat-card:hover{border-color:var(--cyan); background:var(--surface-2);}
.cat-icon{width:44px;height:44px;border-radius:12px;background:var(--cyan-dim);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;}
.cat-info{flex:1; min-width:0;}
.cat-info .name{font-family:'Calibri','IBM Plex Sans',sans-serif; font-weight:700; color:#fff; font-size:15px; margin-bottom:2px;}
.cat-info .meta{font-size:12.5px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace;}
.cat-arrow{color:var(--ink-dim); flex-shrink:0;}
.cat-card.mistakes{border-color:rgba(239,68,68,0.35);}
.cat-card.mistakes .cat-icon{background:var(--red-dim); color:var(--red);}
.cat-card.mistakes:hover{border-color:var(--red);}
.cat-card.mistakes.empty{opacity:.55;}

/* ---- Level 2: topic list ---- */
.level2-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.back-btn{display:flex; align-items:center; gap:6px; color:var(--ink-dim); font-size:13.5px; background:none; border:none;}
.back-btn:hover{color:var(--ink);}
.back-btn svg{width:15px;height:15px;}
.select-toggle{background:var(--surface-2); border:1px solid var(--line); color:var(--ink-dim); font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:999px;}
.select-toggle.on{background:var(--cyan-dim); color:var(--cyan); border-color:var(--cyan);}
.topic-list{display:flex; flex-direction:column; gap:10px; padding-bottom:90px;}
.topic-card{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px; transition:.15s; width:100%; text-align:left;}
.topic-card:hover{border-color:var(--cyan);}
.topic-card.checked{border-color:var(--cyan); background:var(--cyan-dim);}
.topic-badge{width:28px;height:28px;border-radius:8px;background:var(--surface-2); border:1px solid var(--line); display:flex;align-items:center;justify-content:center;font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--ink-dim); flex-shrink:0;}
.topic-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;display:none;align-items:center;justify-content:center;}
.topic-check svg{width:12px;height:12px;opacity:0;}
.topic-card.checked .topic-check{background:var(--cyan); border-color:var(--cyan);}
.topic-card.checked .topic-check svg{opacity:1;}
.select-mode .topic-badge{display:none;}
.select-mode .topic-check{display:flex;}
.topic-info{flex:1; min-width:0;}
.topic-info .t-name{font-family:'Calibri','IBM Plex Sans',sans-serif; font-weight:700; color:#fff; font-size:14px; margin-bottom:3px;}
.topic-info .t-sub{font-size:12px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace;}
.topic-info .t-progress{font-size:11.5px; color:var(--cyan); margin-top:3px; font-family:'IBM Plex Mono',monospace;}

.floating-bar{position:fixed; left:0; right:0; bottom:0; z-index:15; padding:14px 18px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(180deg, transparent, rgba(11,18,32,0.9) 30%, var(--bg) 65%);}
.floating-bar-inner{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:12px;}
.sel-count{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-dim); white-space:nowrap;}
.btn-cyan{flex:1; background:var(--cyan); color:#04202c; border:none; padding:14px 18px; border-radius:999px; font-weight:700; font-size:14.5px; transition:.15s;}
.btn-cyan:active{transform:scale(.98);}
.btn-cyan:disabled{opacity:.35; cursor:not-allowed;}

/* ---- Setup panel ---- */
.setup-card{margin-bottom:16px; border-radius:22px; padding:26px 24px;}
.setup-card h3{font-size:15px; margin-bottom:16px; color:var(--ink-dim); font-weight:600;}
.status-line{font-size:12.5px; color:var(--cyan); font-family:'IBM Plex Mono',monospace; margin-bottom:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.status-line .clear-link{color:var(--ink-dim); text-decoration:underline; background:none; border:none; font-size:12px; cursor:pointer;}
.status-line .clear-link:hover{color:var(--red);}
.segmented{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px;}
.seg-btn{background:var(--surface-2); border:1px solid var(--line); color:var(--ink-dim); padding:13px 24px; border-radius:999px; font-size:14px; font-weight:700; text-align:center; flex:0 0 auto;}
.seg-btn.active{background:transparent; border:1.5px solid var(--cyan); color:var(--cyan);}
.delay-slider{margin-top:4px;}
.delay-slider label{font-size:12px; color:var(--ink-dim); display:block; margin-bottom:8px;}
.delay-slider input[type=range]{width:100%; accent-color:var(--cyan);}
.setup-desc{color:var(--ink-dim); font-size:14.5px; line-height:1.55; margin-bottom:20px;}

/* ---- Question card ---- */
.q-card{position:relative; overflow:hidden; margin-bottom:16px;}
.q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--cyan);}
.review-badge{display:inline-block; font-size:10.5px; font-weight:700; color:var(--gold); background:rgba(245,185,66,0.14); border:1px solid rgba(245,185,66,0.3); padding:3px 9px; border-radius:999px; margin-bottom:10px;}
.q-text{font-family:'Calibri','Sora','Poppins',sans-serif; font-size:16.5px; font-weight:700; color:#fff; line-height:1.45; margin-bottom:14px;}
.options{display:flex; flex-direction:column; gap:10px;}
.opt-row{display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:12px 14px; text-align:left; width:100%; transition:.12s;}
.opt-row:not(.locked):hover{border-color:var(--cyan);}
.opt-letter{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,0.06); display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink-dim); flex-shrink:0;}
.opt-text{font-size:14px; color:var(--ink); line-height:1.35;}
.opt-row.correct{border-color:var(--green); background:var(--green-dim);}
.opt-row.correct .opt-letter{background:var(--green); color:#04220f;}
.opt-row.wrong{border-color:var(--red); background:var(--red-dim);}
.opt-row.wrong .opt-letter{background:var(--red); color:#2a0505;}
.opt-row.dim{opacity:.55;}

.nav-row{display:flex; gap:10px; margin-top:16px;}
.nav-btn{flex:1; background:var(--surface); border:1px solid var(--line); color:var(--ink); padding:13px; border-radius:12px; font-weight:600; font-size:14px;}
.nav-btn:disabled{opacity:.3; cursor:not-allowed;}
.nav-btn.primary{background:var(--cyan); color:#04202c; border:none;}

/* ---- toast ---- */
.toast{position:fixed; bottom:24px; left:50%; transform:translate(-50%,20px); background:var(--surface-2); border:1px solid var(--line); color:var(--ink); padding:12px 20px; border-radius:999px; font-size:13px; z-index:40; opacity:0; transition:.25s; pointer-events:none;}
.toast.show{opacity:1; transform:translate(-50%,0);}

/* ---- Results ---- */
.results-hero{text-align:center; padding:20px 0 8px;}
.pct-big{font-family:'Sora','Poppins',sans-serif; font-size:52px; font-weight:800; color:var(--cyan); line-height:1;}
.results-caption{color:var(--ink-dim); font-size:14px; margin-top:6px;}
.stats-row{display:flex; gap:10px; margin:22px 0;}
.stat-block{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px; text-align:center;}
.stat-block .n{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:700;}
.stat-block .l{font-size:11px; color:var(--ink-dim); margin-top:3px; text-transform:uppercase; letter-spacing:.5px;}
.stat-block.correct .n{color:var(--green);}
.stat-block.wrong .n{color:var(--red);}
.review-list{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
.review-item{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px;}
.review-item .rq{font-size:14px; font-weight:600; margin-bottom:10px; line-height:1.4;}
.ra-row{display:flex; gap:8px; font-size:13px; margin-bottom:5px; line-height:1.4;}
.ra-row .tag{flex-shrink:0; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:5px; text-transform:uppercase; height:fit-content;}
.ra-row.wrong .tag{background:var(--red-dim); color:var(--red);}
.ra-row.wrong span:last-child{color:#f1a3a3;}
.ra-row.correct .tag{background:var(--green-dim); color:var(--green);}
.ra-row.correct span:last-child{color:#9be3ba;}
.review-remove{margin-left:auto; background:none; border:none; color:var(--ink-dim); font-size:11.5px; text-decoration:underline;}
.empty-review{text-align:center; padding:30px 10px; color:var(--ink-dim); font-size:14px;}
.results-actions{display:flex; gap:10px;}

/* ---- Mistakes bank list view ---- */
.bank-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
.bank-actions{display:flex; gap:8px;}
.text-btn{background:none; border:none; color:var(--ink-dim); font-size:12.5px; text-decoration:underline;}
.text-btn:hover{color:var(--ink);}
.text-btn.danger{color:var(--red);}
.bank-item{display:flex; align-items:flex-start; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:10px;}
.bank-item .b-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;margin-top:2px;display:none;align-items:center;justify-content:center;}
.bank-item.select-mode .b-check{display:flex;}
.bank-item.checked .b-check{background:var(--cyan);border-color:var(--cyan);}
.bank-item .b-check svg{width:11px;height:11px;opacity:0;}
.bank-item.checked .b-check svg{opacity:1;}
.bank-item .b-info{flex:1; min-width:0;}
.bank-item .b-q{font-size:13.5px; font-weight:600; margin-bottom:4px; line-height:1.4;}
.bank-item .b-topic{font-size:11px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace;}
.bank-item .b-remove{background:none;border:none;color:var(--ink-dim);font-size:11px;text-decoration:underline;flex-shrink:0;}

.confirm-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50; display:none; align-items:center; justify-content:center; padding:20px;}
.confirm-overlay.active{display:flex;}
.confirm-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px; max-width:340px; width:100%;}
.confirm-box p{font-size:14px; margin-bottom:18px; line-height:1.5;}
.confirm-actions{display:flex; gap:10px;}
.confirm-actions button{flex:1; padding:11px; border-radius:10px; font-weight:600; font-size:13.5px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink);}
.confirm-actions .danger{background:var(--red); border-color:var(--red); color:#fff;}

</style>
</head>
<body>

<header class="app-header">
  <div class="header-row">
    <div class="brand">
      <button class="home-btn" id="home-btn" style="visibility:hidden;" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      </button>
      <div class="wordmark"><span class="z">Z</span><span class="med"> Medicine</span></div>
    </div>
    <div class="header-counter" id="header-counter"></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="subheader-row" id="subheader-row">
    <div class="q-of-total" id="q-header-row">QUESTION 1 OF 1</div>
    <div class="score-pill" id="score-pill">Score: 0</div>
  </div>
</header>

<main class="main-content wrap">

  <!-- ===================== LEVEL 1: HOME ===================== -->
  <section class="screen" id="screen-home">
    <div class="hero">
      <h1 class="heading">Choose a section to start</h1>
      <p>Pick a category to review, or jump into your mistakes bank.</p>
    </div>
    <div class="cat-grid" id="cat-grid"></div>
  </section>

  <!-- ===================== LEVEL 2: TOPIC LIST ===================== -->
  <section class="screen" id="screen-level2">
    <div class="level2-toolbar">
      <button class="back-btn" id="level2-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>Back</button>
      <button class="select-toggle" id="select-toggle-btn">Select</button>
    </div>
    <h2 class="heading" id="level2-title" style="font-size:20px;margin-bottom:14px;"></h2>
    <div class="topic-list" id="topic-list"></div>
  </section>
  <div class="floating-bar" id="level2-floatbar" style="display:none;">
    <div class="floating-bar-inner">
      <span class="sel-count" id="sel-count">0 selected</span>
      <button class="btn-cyan" id="start-selected-btn" disabled>Start Selected</button>
    </div>
  </div>

  <!-- ===================== SETUP PANEL ===================== -->
  <section class="screen" id="screen-setup">
    <div class="level2-toolbar">
      <button class="back-btn" id="setup-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>Back</button>
    </div>
    <h2 class="heading" id="setup-title" style="font-size:30px;line-height:1.2;margin-bottom:10px;"></h2>
    <p class="setup-desc" id="setup-desc"></p>
    <div class="status-line" id="setup-status" style="display:none;"></div>
    <div class="card setup-card">
      <h3>Repeat missed questions</h3>
      <div class="segmented">
        <button class="seg-btn" data-mode="none">No repeat</button>
        <button class="seg-btn" data-mode="time">After a delay</button>
        <button class="seg-btn active" data-mode="end">After all questions</button>
      </div>
      <div class="delay-slider" id="delay-slider-wrap" style="display:none;">
        <label>Delay: <span id="delay-label">5 min</span></label>
        <input type="range" id="delay-range" min="1" max="15" value="5">
      </div>
    </div>
    <button class="btn-cyan" id="start-quiz-btn" style="width:100%;">Start Quiz</button>
  </section>

  <!-- ===================== QUIZ ===================== -->
  <section class="screen" id="screen-quiz">
    <div class="card q-card" id="q-card"></div>
    <div class="nav-row">
      <button class="nav-btn" id="btn-prev">‹ Previous</button>
      <button class="nav-btn primary" id="btn-next">Next ›</button>
    </div>
    <div style="text-align:center;margin-top:16px;">
      <button class="text-btn" id="quiz-exit-btn">Exit to home (progress is saved)</button>
    </div>
  </section>

  <!-- ===================== RESULTS ===================== -->
  <section class="screen" id="screen-results">
    <div class="results-hero">
      <div class="pct-big" id="res-pct">0%</div>
      <div class="results-caption" id="res-caption"></div>
    </div>
    <div class="stats-row">
      <div class="stat-block correct"><div class="n" id="res-correct">0</div><div class="l">Correct</div></div>
      <div class="stat-block wrong"><div class="n" id="res-wrong">0</div><div class="l">Wrong</div></div>
      <div class="stat-block"><div class="n" id="res-total">0</div><div class="l">Total</div></div>
    </div>
    <div class="review-list" id="review-list"></div>
    <div class="results-actions">
      <button class="nav-btn" id="btn-results-home">Home</button>
      <button class="nav-btn primary" id="btn-restart">Restart Quiz</button>
    </div>
  </section>

  <!-- ===================== MISTAKES BANK MANAGE ===================== -->
  <section class="screen" id="screen-bank">
    <div class="level2-toolbar">
      <button class="back-btn" id="bank-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>Back</button>
      <button class="select-toggle" id="bank-select-btn">Select</button>
    </div>
    <h2 class="heading" style="font-size:20px;margin-bottom:10px;">My Mistakes</h2>
    <div class="bank-toolbar">
      <span class="mono" id="bank-sel-count" style="display:none;font-size:12.5px;color:var(--ink-dim);"></span>
      <div class="bank-actions">
        <button class="text-btn" id="bank-delete-selected-btn" style="display:none;">Delete selected</button>
        <button class="text-btn danger" id="bank-delete-all-btn">Delete all</button>
      </div>
    </div>
    <div id="bank-items"></div>
  </section>

</main>

<div class="toast" id="toast"></div>
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <p id="confirm-text"></p>
    <div class="confirm-actions">
      <button id="confirm-no">Cancel</button>
      <button class="danger" id="confirm-yes">Confirm</button>
    </div>
  </div>

 ["Loss of memory due to brain injury", "Loss of memory in reaction to a traumatic event", "Drug-induced memory loss", "Age-related memory decline"], "correct": 1}, {"id": 374, "q": "Dissociative amnesia is characterized as being:", "options": ["Physical rather than psychological.", "Neurological rather than functional.", "Psychological rather than physical.", "Systemic rather than localized."], "correct": 2}, {"id": 375, "q": "In dissociative amnesia, the forgoden information is usually:", "options": ["General knowledge", "Recent academic material", "Autobiographical and stressful events", "Language skills", "Motor skills"], "correct": 2}, {"id": 376, "q": "Generalized amnesia is defined as:", "options": ["Inability to recall events related to a circumscribed period of Eme.", "Ability to remember some, but not all, of the events occurring during a circumscribed period of Eme.", "Failure to recall one's entire life.", "Failure to remember a category of information."], "correct": 2}, {"id": 377, "q": "Which type of dissociative amnesia involves loss of memory for one’s entire life?", "options": ["Localized amnesia", "Selective amnesia", "Continuous amnesia", "Generalized amnesia", "Systematized amnesia"], "correct": 3}, {"id": 378, "q": "Localized amnesia is defined as:", "options": ["Failure to recall successive events as they occur.", "Inability to recall events related to a circumscribed period of Eme.", "Failure to remember a category of information, such as all memories relating to one's family.", "Failure to recall one's entire life."], "correct": 1}, {"id": 379, "q": "Selective amnesia is defined as:", "options": ["Failure to recall successive events as they occur.", "Inability to recall events related to a circumscribed period of Eme.", "Failure to remember a category of information, such as all memories relating to a particular person.", "Ability to remember some, but not all, of the events occurring during a circumscribed period of Eme."], "correct": 3}, {" heir behavior without asking them is a subtype of jumping to conclusions called:", "options": ["Fortune-telling", "Mind reading", "Minimization", "Labeling"], "correct": 1}, {"id": 449, "q": "10. A person who focuses only on the negative details of a situation while ignoring the positive aspects is demonstrating:", "options": ["Mental Ultering", "Overgeneralization", "Catastrophizing", "Splitng"], "correct": 0}, {"id": 450, "q": "Giving greater weight to the worst possible outcome, however unlikely, is called:", "options": ["Emotional reasoning", "Catastrophizing", "Blaming", "Overgeneralizing"], "correct": 1}]}, {"id": "personality-disorders", "name": "Personality Disorders", "icon": "😔", "questions": [{"id": 451, "q": "What is the estimated median rate of diagnosable Personality Disorders in the general population?", "options": ["5.2%", "10.6%", "20.0%", "40-60%"], "correct": 1}, {"id": 452, "q": "Generally, all personality disorders are more prevalent in males EXCEPT:", "options": ["Paranoid and Schizoid", "Borderline, Histrionic, and Dependent", "Antisocial and Narcissistic", "Schizotypal and OCPD"], "correct": 1}, {"id": 453, "q": "Decreased levels of which neurotransmitter are associated with impulsivity and aggression?", "options": ["Dopamine", "Serotonin (SE)", "Norepinephrine (NE)", "Acetylcholine"], "correct": 1}, {"id": 454, "q": "Which Personality Disorder cluster is described as \"odd or eccentric\"?", "options": ["Cluster A", "Cluster C", "Cluster B"], "correct": 0}, {"id": 455, "q": "Paranoid and schizoid personality disorders belong to:", "options": ["Cluster A", "Cluster B", "Cluster C", "Mood disorders"], "correct": 0}, {"id": 456, "q": "Which of these is a personality disorder characterized by extreme suspiciousness and distrust of others?", "options": ["Paranoid Personality Disorder", "Narcissistic Personality Disorder", "Obsessive-Compulsive Personality Disorder", "Antisocial Personality Disorder"], "correct": 0}, {"id": 457, "q": "Which Persona <script>
var CATEGORIES = JSON.parse(document.getElementById("quiz-data").textContent);
</script>
<script>
(function(){
"use strict";

/* ============================================================
   STORAGE
============================================================ */
var LS_PROGRESS = "zmed_progress_v1";
var LS_MISTAKES = "zmed_mistakes_v1";
var lsOk = true;
function lsGet(key, fallback){
  try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ lsOk = false; return fallback; }
}
function lsSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ lsOk = false; }
}
var progressStore = lsGet(LS_PROGRESS, {});   // topicKey -> {answers:{qid:{chosen,correct}}, everWrong:{qid:true}, snapshot:null}
var mistakesStore = lsGet(LS_MISTAKES, []);   // [{catId,topicId,qid,addedAt}] newest first

function saveProgress(){ lsSet(LS_PROGRESS, progressStore); }
function saveMistakes(){ lsSet(LS_MISTAKES, mistakesStore); }
function topicKey(catId, topicId){ return catId + "::" + topicId; }

/* ============================================================
   DATA INDEX
============================================================ */
var CAT_BY_ID = {}, TOPIC_BY_KEY = {}, Q_BY_UID = {};
CATEGORIES.forEach(function(cat){
  CAT_BY_ID[cat.id] = cat;
  cat.topics.forEach(function(t){
    TOPIC_BY_KEY[topicKey(cat.id, t.id)] = { cat:cat, topic:t };
    t.questions.forEach(function(q){
      var uid = topicKey(cat.id, t.id) + "::" + q.id;
      Q_BY_UID[uid] = { uid:uid, catId:cat.id, topicId:t.id, catName:cat.name, topicName:t.name, q:q };
    });
  });
});

function topicProgressCount(catId, topicId){
  var tk = topicKey(catId, topicId);
  var rec = progressStore[tk];
  if(!rec) return 0;
  return Object.keys(rec.answers || {}).length;
}
function topicHasSnapshot(catId, topicId){
  var tk = topicKey(catId, topicId);
  var rec = progressStore[tk];
  return !!(rec && rec.snapshot);
}

/* ============================================================
   NAV / SCREEN STATE
============================================================ */
var screens = {};
["home","level2","setup","quiz","results","bank"].forEach(function(id){
  screens[id] = document.getElementById("screen-" + id);
});
var homeBtn = document.getElementById("home-btn");
var subheaderRow = document.getElementById("subheader-row");
var headerCounter = document.getElementById("header-counter");
var progressFill = document.getElementById("progress-fill");

function showScreen(id){
  Object.keys(screens).forEach(function(k){ screens[k].classList.toggle("active", k===id); });
  subheaderRow.classList.toggle("active", id === "quiz");
  homeBtn.style.visibility = (id === "home") ? "hidden" : "visible";
  if(id !== "quiz"){ headerCounter.textContent=""; progressFill.style.width="0%"; }
  window.scrollTo(0,0);
}

homeBtn.addEventListener("click", function(){ goHome(); });
function goHome(){ renderHome(); showScreen("home"); }

/* ============================================================
   LEVEL 1: HOME
============================================================ */
var catGrid = document.getElementById("cat-grid");
function renderHome(){
  catGrid.innerHTML = "";
  CATEGORIES.forEach(function(cat){
    var btn = document.createElement("button");
    btn.className = "cat-card";
    btn.innerHTML =
      '<div class="cat-icon">'+cat.icon+'</div>'+
      '<div class="cat-info"><div class="name">'+escapeHtml(cat.name)+'</div>'+
      '<div class="meta">'+cat.topics.length+' topics</div></div>'+
      '<svg class="cat-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';
    btn.addEventListener("click", function(){ openCategory(cat.id); });
    catGrid.appendChild(btn);
  });

  var mCount = mistakesStore.length;
  var mBtn = document.createElement("button");
  mBtn.className = "cat-card mistakes" + (mCount===0 ? " empty" : "");
  mBtn.innerHTML =
    '<div class="cat-icon">⚠️</div>'+
    '<div class="cat-info"><div class="name">My Mistakes</div>'+
    '<div class="meta">'+mCount+' questions</div></div>'+
    '<svg class="cat-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';
  mBtn.addEventListener("click", function(){
    if(mCount === 0){ toast("Your mistakes bank is empty."); return; }
    openMistakesSetup();
  });
  catGrid.appendChild(mBtn);

  if(mCount > 0){
    var manageBtn = document.createElement("button");
    manageBtn.className = "text-btn";
    manageBtn.style.textAlign = "left";
    manageBtn.style.margin = "-4px 0 4px 4px";
    manageBtn.textContent = "Manage mistakes bank →";
    manageBtn.addEventListener("click", function(e){ e.stopPropagation(); openBankList(); });
    catGrid.appendChild(manageBtn);
  }
}

/* ============================================================
   LEVEL 2: TOPIC LIST
============================================================ */
var level2Title = document.getElementById("level2-title");
var topicListEl = document.getElementById("topic-list");
var level2FloatBar = document.getElementById("level2-floatbar");
var selectToggleBtn = document.getElementById("select-toggle-btn");
var selCountEl = document.getElementById("sel-count");
var startSelectedBtn = document.getElementById("start-selected-btn");

var currentCatId = null;
var l2SelectMode = false;
var l2Selected = {};

function openCategory(catId){
  currentCatId = catId;
  l2SelectMode = false; l2Selected = {};
  renderLevel2();
  showScreen("level2");
}

function renderLevel2(){
  var cat = CAT_BY_ID[currentCatId];
  level2Title.textContent = cat.name;
  topicListEl.innerHTML = "";
  topicListEl.classList.toggle("select-mode", l2SelectMode);
  selectToggleBtn.classList.toggle("on", l2SelectMode);
  selectToggleBtn.textContent = l2SelectMode ? "Cancel" : "Select";

  cat.topics.forEach(function(t, idx){
    var answered = topicProgressCount(cat.id, t.id);
    var total = t.questions.length;
    var card = document.createElement("button");
    card.className = "topic-card" + (l2Selected[t.id] ? " checked" : "");
    var progHtml = answered > 0 ? '<div class="t-progress">'+answered+' of '+total+' answered'+(answered<total ? ' \u2014 '+(total-answered)+' remaining' : ' \u2014 complete')+'</div>' : '';
    card.innerHTML =
      '<div class="topic-badge">'+(idx+1)+'</div>'+
      '<div class="topic-check"><svg viewBox="0 0 24 24" fill="none" stroke="#04202c" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>'+
      '<div class="topic-info"><div class="t-name">'+escapeHtml(t.name)+'</div>'+
      '<div class="t-sub">'+total+' questions</div>'+progHtml+'</div>';
    card.addEventListener("click", function(){
      if(l2SelectMode){
        if(l2Selected[t.id]) delete l2Selected[t.id]; else l2Selected[t.id] = true;
        renderLevel2();
      } else {
        openTopicSetup(cat.id, [t.id]);
      }
    });
    topicListEl.appendChild(card);
  });

  var selKeys = Object.keys(l2Selected);
  level2FloatBar.style.display = l2SelectMode ? "block" : "none";
  var qCount = 0;
  selKeys.forEach(function(tid){
    var t = cat.topics.find(function(x){ return x.id === tid; });
    if(t) qCount += t.questions.length;
  });
  selCountEl.textContent = selKeys.length + " selected \u00b7 " + qCount + " questions";
  startSelectedBtn.disabled = selKeys.length === 0;
}

selectToggleBtn.addEventListener("click", function(){
  l2SelectMode = !l2SelectMode; l2Selected = {}; renderLevel2();
});
document.getElementById("level2-back").addEventListener("click", goHome);
startSelectedBtn.addEventListener("click", function(){
  var tids = Object.keys(l2Selected);
  if(!tids.length) return;
  openTopicSetup(currentCatId, tids);
});

/* ============================================================
   SETUP PANEL
============================================================ */
var setupTitle = document.getElementById("setup-title");
var setupDesc = document.getElementById("setup-desc");
var setupStatus = document.getElementById("setup-status");
var setupBack = document.getElementById("setup-back");
var segButtons = document.querySelectorAll(".seg-btn");
var delaySliderWrap = document.getElementById("delay-slider-wrap");
var delayRange = document.getElementById("delay-range");
var delayLabel = document.getElementById("delay-label");
var startQuizBtn = document.getElementById("start-quiz-btn");

var setupScope = null; // {catId, topicIds, isMistakes, backTo}
var requeueMode = "end"; // 'none' | 'time' | 'end'
var requeueMinutes = 5;

function openTopicSetup(catId, topicIds){
  setupScope = { catId:catId, topicIds:topicIds, isMistakes:false };
  var cat = CAT_BY_ID[catId];
  var totalQs = 0;
  if(topicIds.length === 1){
    var t = cat.topics.find(function(x){ return x.id === topicIds[0]; });
    setupTitle.textContent = t.name;
    totalQs = t.questions.length;
    var answered = topicProgressCount(catId, t.id);
    var total = t.questions.length;
    if(answered > 0){
      setupStatus.style.display = "flex";
      setupStatus.innerHTML = "You've answered "+answered+" of "+total+" \u2014 "+(total-answered)+" remaining"+
        ' <button class="clear-link" id="clear-progress-btn">Clear progress</button>';
      document.getElementById("clear-progress-btn").addEventListener("click", function(){
        confirmAction("Clear your saved progress for \u201c"+t.name+"\u201d? This can't be undone.", function(){
          var tk = topicKey(catId, t.id);
          delete progressStore[tk];
          saveProgress();
          openTopicSetup(catId, topicIds);
        });
      });
    } else {
      setupStatus.style.display = "none";
    }
  } else {
    setupTitle.textContent = cat.name + " \u2014 " + topicIds.length + " topics";
    setupStatus.style.display = "none";
    topicIds.forEach(function(tid){
      var t2 = cat.topics.find(function(x){ return x.id === tid; });
      if(t2) totalQs += t2.questions.length;
    });
  }
  setupDesc.textContent = totalQs + " questions. Choose how you want questions you get wrong to reappear while you're working through the quiz.";
  setupBack.onclick = function(){ showScreen("level2"); };
  showScreen("setup");
}

function openMistakesSetup(){
  setupScope = { catId:null, topicIds:null, isMistakes:true };
  setupTitle.textContent = "My Mistakes";
  setupStatus.style.display = "none";
  setupDesc.textContent = mistakesStore.length + " questions. Choose how you want questions you get wrong to reappear while you're working through the quiz.";
  setupBack.onclick = goHome;
  showScreen("setup");
}

segButtons.forEach(function(btn){
  btn.addEventListener("click", function(){
    segButtons.forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    requeueMode = btn.getAttribute("data-mode");
    delaySliderWrap.style.display = requeueMode === "time" ? "block" : "none";
  });
});
delayRange.addEventListener("input", function(){
  requeueMinutes = parseInt(delayRange.value, 10);
  delayLabel.textContent = requeueMinutes + " min";
});

startQuizBtn.addEventListener("click", function(){
  var pool = buildPool();
  if(!pool.length){ toast("No questions available."); return; }
  var resumeSnapshot = null;
  if(setupScope.topicIds && setupScope.topicIds.length === 1){
    var tk = topicKey(setupScope.catId, setupScope.topicIds[0]);
    var rec = progressStore[tk];
    if(rec && rec.snapshot) resumeSnapshot = rec.snapshot;
  }
  startQuiz(pool, resumeSnapshot);
});

function buildPool(){
  if(setupScope.isMistakes){
    return mistakesStore.map(function(m){
      return Q_BY_UID[topicKey(m.catId, m.topicId) + "::" + m.qid];
    }).filter(Boolean);
  }
  var cat = CAT_BY_ID[setupScope.catId];
  var pool = [];
  setupScope.topicIds.forEach(function(tid){
    var t = cat.topics.find(function(x){ return x.id === tid; });
    t.questions.forEach(function(q){
      pool.push(Q_BY_UID[topicKey(cat.id, tid) + "::" + q.id]);
    });
  });
  return pool;
}

/* ============================================================
   QUIZ ENGINE
============================================================ */
var session = null;
var letters = ["A","B","C","D","E","F"];

var qCard = document.getElementById("q-card");
var qHeader = document.getElementById("q-header-row");
var scorePillEl = document.getElementById("score-pill");
var quizExitBtn = document.getElementById("quiz-exit-btn");

function startQuiz(pool, resumeSnapshot){
  if(resumeSnapshot){
    session = resumeSnapshot;
  } else {
    session = {
      queue: pool.map(function(item){ return { uid:item.uid, isRequeued:false }; }),
      pointer: 0,
      answers: {},
      wrongSet: {},
      requeueMode: requeueMode,
      requeueMinutes: requeueMinutes,
      pendingRequeue: [],
      requeuedOnce: {}
    };
  }
  persistSnapshotIfSingleTopic();
  showScreen("quiz");
  renderQuizQuestion();
}

function persistSnapshotIfSingleTopic(){
  if(setupScope && setupScope.topicIds && setupScope.topicIds.length === 1 && !setupScope.isMistakes){
    var tk = topicKey(setupScope.catId, setupScope.topicIds[0]);
    if(!progressStore[tk]) progressStore[tk] = { answers:{}, everWrong:{} };
    progressStore[tk].snapshot = session;
    saveProgress();
  }
}

function currentItem(){ return session.queue[session.pointer]; }

function renderQuizQuestion(){
  var item = currentItem();
  var ref = Q_BY_UID[item.uid];
  var q = ref.q;
  var answeredCount = uniqueAnsweredCount();
  var uniqueTotal = uniqueQueueCount();

  headerCounter.textContent = (session.pointer+1) + " / " + session.queue.length;
  progressFill.style.width = Math.round(((session.pointer+1)/session.queue.length)*100) + "%";
  qHeader.textContent = "QUESTION " + (session.pointer+1) + " OF " + session.queue.length;
  scorePillEl.textContent = "Score: " + scoreCount();

  var rec = session.answers[item.uid];
  var html = "";
  if(item.isRequeued) html += '<div class="review-badge">REVIEW</div>';
  html += '<div class="q-text">' + escapeHtml(q.q) + '</div>';
  html += '<div class="options">';
  q.options.forEach(function(opt, i){
    var cls = "opt-row";
    if(rec){
      cls += " locked";
      if(i === q.correct) cls += " correct";
      else if(i === rec.chosen) cls += " wrong";
      else cls += " dim";
    }
    html += '<button class="'+cls+'" data-idx="'+i+'"><div class="opt-letter">'+letters[i]+'</div><div class="opt-text">'+escapeHtml(opt)+'</div></button>';
  });
  html += '</div>';
  qCard.innerHTML = html;

  if(!rec){
    qCard.querySelectorAll(".opt-row").forEach(function(btn){
      btn.addEventListener("click", function(){ answerQuestion(parseInt(btn.getAttribute("data-idx"),10)); });
    });
  }

  document.getElementById("btn-prev").disabled = session.pointer === 0;
  var nextBtn = document.getElementById("btn-next");
  nextBtn.textContent = session.pointer === session.queue.length - 1 ? "Finish Quiz \u203a" : "Next \u203a";
}

function uniqueQueueCount(){
  return new Set(session.queue.map(function(it){ return it.uid; })).size;
}
function uniqueAnsweredCount(){
  return Object.keys(session.answers).length;
}
function scoreCount(){
  var c = 0;
  Object.keys(session.answers).forEach(function(uid){
    if(session.answers[uid].correct) c++;
  });
  return c;
}

/* ---- sound effects ---- */
var audioCtx = null;
function getCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  return audioCtx;
}
function playCorrectSound(){
  var ctx = getCtx(); if(!ctx) return;
  var t = ctx.currentTime;
  [ [800,t,0.1], [1200,t+0.1,0.15] ].forEach(function(cfg){
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "sine"; osc.frequency.value = cfg[0];
    gain.gain.setValueAtTime(0.18, cfg[1]);
    gain.gain.exponentialRampToValueAtTime(0.001, cfg[1]+cfg[2]);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(cfg[1]); osc.stop(cfg[1]+cfg[2]);
  });
}
function playWrongSound(){
  var ctx = getCtx(); if(!ctx) return;
  var t = ctx.currentTime;
  var osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = "sawtooth"; osc.frequency.value = 200;
  gain.gain.setValueAtTime(0.16, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.35);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.35);
}

function answerQuestion(idx){
  var item = currentItem();
  var ref = Q_BY_UID[item.uid];
  var q = ref.q;
  var isCorrect = idx === q.correct;

  session.answers[item.uid] = { chosen: idx, correct: isCorrect };

  recordTopicProgress(ref, idx, isCorrect);

  if(!isCorrect){
    session.wrongSet[item.uid] = true;
    addToMistakesBank(ref);
    scheduleRequeue(item.uid);
    playWrongSound();
  } else {
    delete session.wrongSet[item.uid];
  }

  persistSnapshotIfSingleTopic();
  if(isCorrect) playCorrectSound();
  renderQuizQuestion();
}

function recordTopicProgress(ref, chosen, correct){
  var tk = topicKey(ref.catId, ref.topicId);
  if(!progressStore[tk]) progressStore[tk] = { answers:{}, everWrong:{} };
  var rec = progressStore[tk];
  rec.answers[ref.q.id] = { chosen: chosen, correct: correct };
  if(!correct) rec.everWrong[ref.q.id] = true;
  saveProgress();
}

function addToMistakesBank(ref){
  mistakesStore = mistakesStore.filter(function(m){
    return !(m.catId===ref.catId && m.topicId===ref.topicId && m.qid===ref.q.id);
  });
  mistakesStore.unshift({ catId:ref.catId, topicId:ref.topicId, qid:ref.q.id, addedAt:Date.now() });
  saveMistakes();
}

function scheduleRequeue(uid){
  if(session.requeueMode === "none") return;
  if(session.requeuedOnce[uid]) return;
  session.requeuedOnce[uid] = true;
  if(session.requeueMode === "time"){
    session.pendingRequeue.push({ uid:uid, at: Date.now() + session.requeueMinutes*60000 });
  } else if(session.requeueMode === "end"){
    session.pendingRequeue.push({ uid:uid, at:null });
  }
}

function checkPendingRequeues(){
  if(!session.pendingRequeue.length) return false;
  var now = Date.now();
  var stillPending = [];
  var injected = false;
  session.pendingRequeue.forEach(function(pr){
    var readyByTime = pr.at !== null && now >= pr.at;
    var readyByEnd = pr.at === null && session.pointer >= session.queue.length-1;
    var rec = session.answers[pr.uid];
    var stillWrong = rec && !rec.correct;
    if((readyByTime || readyByEnd) && stillWrong && session.wrongSet[pr.uid]){
      session.queue.push({ uid: pr.uid, isRequeued:true });
      delete session.answers[pr.uid];
      injected = true;
      if(readyByTime && document.hasFocus()) showToast("A missed question has been requeued.");
    } else {
      stillPending.push(pr);
    }
  });
  session.pendingRequeue = stillPending;
  return injected;
}

document.getElementById("btn-prev").addEventListener("click", function(){
  if(session.pointer > 0){ session.pointer--; renderQuizQuestion(); }
});
document.getElementById("btn-next").addEventListener("click", function(){
  checkPendingRequeues();
  if(session.pointer < session.queue.length - 1){
    session.pointer++;
    persistSnapshotIfSingleTopic();
    renderQuizQuestion();
  } else {
    var injected = checkPendingRequeues();
    if(injected && session.pointer < session.queue.length - 1){
      session.pointer++;
      persistSnapshotIfSingleTopic();
      renderQuizQuestion();
    } else {
      finishQuiz();
    }
  }
});
quizExitBtn.addEventListener("click", function(){
  goHome();
});

/* ============================================================
   RESULTS
============================================================ */
var resPct = document.getElementById("res-pct");
var resCaption = document.getElementById("res-caption");
var resCorrect = document.getElementById("res-correct");
var resWrong = document.getElementById("res-wrong");
var resTotal = document.getElementById("res-total");
var reviewListEl = document.getElementById("review-list");

function finishQuiz(){
  var uniqueUids = Array.from(new Set(session.queue.map(function(it){ return it.uid; })));
  var correctCount = 0, wrongUids = [];
  uniqueUids.forEach(function(uid){
    var rec = session.answers[uid];
    if(rec && rec.correct) correctCount++;
    else wrongUids.push(uid);
  });
  var total = uniqueUids.length;
  var pct = total ? Math.round((correctCount/total)*100) : 0;

  resPct.textContent = pct + "%";
  resCaption.textContent = wrongUids.length===0 ? "Perfect run \u2014 nothing to review." : "Review the questions you missed below.";
  resCorrect.textContent = correctCount;
  resWrong.textContent = wrongUids.length;
  resTotal.textContent = total;

  reviewListEl.innerHTML = "";
  if(wrongUids.length === 0){
    reviewListEl.innerHTML = '<div class="empty-review">Nothing missed this round. Nicely done.</div>';
  } else {
    wrongUids.forEach(function(uid){
      var ref = Q_BY_UID[uid];
      var q = ref.q;
      var rec = session.answers[uid];
      var chosenText = rec ? q.options[rec.chosen] : "(not answered)";
      var box = document.createElement("div");
      box.className = "review-item";
      var removeBtn = setupScope && setupScope.isMistakes ?
        '<button class="review-remove" data-uid="'+uid+'">Remove from bank</button>' : '';
      box.innerHTML =
        '<div class="rq">'+escapeHtml(q.q)+'</div>'+
        '<div class="ra-row wrong"><span class="tag">Your answer</span><span>'+escapeHtml(chosenText)+'</span></div>'+
        '<div class="ra-row correct"><span class="tag">Correct</span><span>'+escapeHtml(q.options[q.correct])+'</span></div>'+
        removeBtn;
      reviewListEl.appendChild(box);
    });
    reviewListEl.querySelectorAll(".review-remove").forEach(function(btn){
      btn.addEventListener("click", function(){
        var uid = btn.getAttribute("data-uid");
        var ref = Q_BY_UID[uid];
        removeFromMistakesBank(ref.catId, ref.topicId, ref.q.id);
        btn.parentElement.style.opacity = "0.4";
        btn.disabled = true; btn.textContent = "Removed";
      });
    });
  }

  clearSnapshotIfSingleTopic();
  showScreen("results");
}

function clearSnapshotIfSingleTopic(){
  if(setupScope && setupScope.topicIds && setupScope.topicIds.length === 1 && !setupScope.isMistakes){
    var tk = topicKey(setupScope.catId, setupScope.topicIds[0]);
    if(progressStore[tk]) { progressStore[tk].snapshot = null; saveProgress(); }
  }
}

document.getElementById("btn-restart").addEventListener("click", function(){
  if(setupScope.isMistakes){ openMistakesSetup(); }
  else { openTopicSetup(setupScope.catId, setupScope.topicIds); }
});
document.getElementById("btn-results-home").addEventListener("click", goHome);

/* ============================================================
   MISTAKES BANK MANAGE LIST
============================================================ */
var bankListEl = document.getElementById("bank-items");
var bankSelectBtn = document.getElementById("bank-select-btn");
var bankDeleteAllBtn = document.getElementById("bank-delete-all-btn");
var bankDeleteSelectedBtn = document.getElementById("bank-delete-selected-btn");
var bankSelCount = document.getElementById("bank-sel-count");
var bankSelectMode = false;
var bankSelected = {};

function openBankList(){
  bankSelectMode = false; bankSelected = {};
  renderBankList();
  showScreen("bank");
}
document.getElementById("bank-back").addEventListener("click", goHome);

function renderBankList(){
  bankListEl.innerHTML = "";
  bankSelectBtn.textContent = bankSelectMode ? "Cancel" : "Select";
  bankSelectBtn.classList.toggle("on", bankSelectMode);
  var selKeys = Object.keys(bankSelected);
  bankDeleteSelectedBtn.style.display = (bankSelectMode && selKeys.length>0) ? "inline" : "none";
  bankSelCount.style.display = bankSelectMode ? "inline" : "none";
  bankSelCount.textContent = selKeys.length + " selected";

  if(mistakesStore.length === 0){
    bankListEl.innerHTML = '<div class="empty-review">Your mistakes bank is empty.</div>';
    return;
  }

  mistakesStore.forEach(function(m){
    var uid = topicKey(m.catId, m.topicId) + "::" + m.qid;
    var ref = Q_BY_UID[uid];
    if(!ref) return;
    var key = m.catId+"|"+m.topicId+"|"+m.qid;
    var row = document.createElement("div");
    row.className = "bank-item" + (bankSelectMode ? " select-mode" : "") + (bankSelected[key] ? " checked" : "");
    row.innerHTML =
      '<div class="b-check"><svg viewBox="0 0 24 24" fill="none" stroke="#04202c" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>'+
      '<div class="b-info"><div class="b-q">'+escapeHtml(ref.q.q)+'</div><div class="b-topic">'+escapeHtml(ref.topicName)+'</div></div>'+
      '<button class="b-remove">Remove</button>';
    row.querySelector(".b-remove").addEventListener("click", function(e){
      e.stopPropagation();
      removeFromMistakesBank(m.catId, m.topicId, m.qid);
      renderBankList();
    });
    row.addEventListener("click", function(){
      if(!bankSelectMode) return;
      if(bankSelected[key]) delete bankSelected[key]; else bankSelected[key] = true;
      renderBankList();
    });
    bankListEl.appendChild(row);
  });
}

bankSelectBtn.addEventListener("click", function(){
  bankSelectMode = !bankSelectMode; bankSelected = {}; renderBankList();
});
bankDeleteAllBtn.addEventListener("click", function(){
  if(!mistakesStore.length) return;
  confirmAction("Delete all "+mistakesStore.length+" questions from your mistakes bank? This can't be undone.", function(){
    mistakesStore = []; saveMistakes(); bankSelectMode=false; bankSelected={}; renderBankList(); renderHome();
  });
});
bankDeleteSelectedBtn.addEventListener("click", function(){
  var keys = Object.keys(bankSelected);
  if(!keys.length) return;
  confirmAction("Delete "+keys.length+" selected question(s) from your mistakes bank?", function(){
    mistakesStore = mistakesStore.filter(function(m){
      var key = m.catId+"|"+m.topicId+"|"+m.qid;
      return keys.indexOf(key) === -1;
    });
    saveMistakes();
    bankSelectMode = false; bankSelected = {};
    renderBankList(); renderHome();
  });
});

function removeFromMistakesBank(catId, topicId, qid){
  mistakesStore = mistakesStore.filter(function(m){
    return !(m.catId===catId && m.topicId===topicId && m.qid===qid);
  });
  saveMistakes();
}

/* ============================================================
   HELPERS: toast, confirm, escape
============================================================ */
var toastEl = document.getElementById("toast");
var toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2600);
}
function toast(msg){ showToast(msg); }

var confirmOverlay = document.getElementById("confirm-overlay");
var confirmText = document.getElementById("confirm-text");
var confirmYes = document.getElementById("confirm-yes");
var confirmNo = document.getElementById("confirm-no");
var confirmCb = null;
function confirmAction(msg, cb){
  confirmText.textContent = msg;
  confirmCb = cb;
  confirmOverlay.classList.add("active");
}
confirmYes.addEventListener("click", function(){
  confirmOverlay.classList.remove("active");
  if(confirmCb) confirmCb();
  confirmCb = null;
});
confirmNo.addEventListener("click", function(){
  confirmOverlay.classList.remove("active");
  confirmCb = null;
});

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ============================================================
   INIT
============================================================ */
renderHome();
showScreen("home");

})();

</script>
