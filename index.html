<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كويز طب — المنشئ Z</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --card: #1a2235;
    --border: #2a3550;
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --gold: #f59e0b;
    --correct: #10b981;
    --wrong: #ef4444;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --white: #ffffff;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 60% 40% at 80% 10%, rgba(59,130,246,.12) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 10% 80%, rgba(6,182,212,.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── SCREENS ── */
  .screen { display:none; position:relative; z-index:1; }
  .screen.active { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px 16px; }

  /* ── HOME ── */
  #home-screen {
    text-align: center;
    gap: 32px;
  }

  .logo-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-family: 'Tajawal', sans-serif;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 6px 18px;
    border-radius: 50px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .home-title {
    font-family: 'Tajawal', sans-serif;
    font-weight: 900;
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    line-height: 1.1;
    background: linear-gradient(135deg, var(--white), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .home-sub {
    color: var(--muted);
    font-size: 1rem;
    margin-top: 8px;
  }

  .topics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    width: 100%;
    max-width: 860px;
  }

  .topic-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    cursor: pointer;
    transition: all .25s ease;
    text-align: right;
    position: relative;
    overflow: hidden;
  }
  .topic-card::before {
    content:'';
    position:absolute;
    top:0; right:0;
    width:4px; height:100%;
    background: linear-gradient(var(--accent), var(--accent2));
    border-radius: 0 16px 16px 0;
    opacity: 0;
    transition: opacity .25s;
  }
  .topic-card:hover { 
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(59,130,246,.2);
  }
  .topic-card:hover::before { opacity:1; }

  .topic-num {
    font-size: 11px;
    color: var(--accent2);
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .topic-name {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--white);
    line-height: 1.4;
  }
  .topic-count {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  .topic-done {
    position:absolute;
    top:12px; left:14px;
    width:22px; height:22px;
    background: var(--correct);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px;
    opacity:0;
    transition: opacity .2s;
  }
  .topic-card.completed .topic-done { opacity:1; }

  /* ── QUIZ SCREEN ── */
  #quiz-screen {
    justify-content: flex-start;
    padding-top: 24px;
    padding-bottom: 40px;
    gap: 20px;
  }

  .quiz-header {
    width: 100%;
    max-width: 700px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .quiz-topic-label {
    font-family: 'Tajawal', sans-serif;
    font-weight: 900;
    font-size: 1.15rem;
    color: var(--white);
  }

  .quiz-progress-info {
    font-size: 13px;
    color: var(--muted);
  }

  .progress-bar-wrap {
    width: 100%;
    max-width: 700px;
    height: 6px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 10px;
    transition: width .4s ease;
  }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 26px;
    width: 100%;
    max-width: 700px;
    animation: fadeUp .3s ease;
  }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .q-number {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent2);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .q-text {
    font-size: 1.08rem;
    font-weight: 600;
    line-height: 1.7;
    color: var(--white);
    margin-bottom: 22px;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: .97rem;
    font-weight: 600;
    padding: 13px 18px;
    border-radius: 12px;
    text-align: right;
    cursor: pointer;
    transition: all .2s ease;
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .option-letter {
    width: 28px;
    height: 28px;
    min-width: 28px;
    border-radius: 8px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .82rem;
    font-weight: 700;
    color: var(--muted);
    transition: all .2s;
    order: 2;
    margin-right: auto;
  }

  .option-text { order:1; flex:1; }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(59,130,246,.08);
  }
  .option-btn:hover:not(:disabled) .option-letter {
    background: var(--accent);
    color: #fff;
  }

  .option-btn.correct {
    border-color: var(--correct);
    background: rgba(16,185,129,.1);
    color: var(--correct);
  }
  .option-btn.correct .option-letter { background:var(--correct); color:#fff; }

  .option-btn.wrong {
    border-color: var(--wrong);
    background: rgba(239,68,68,.1);
    color: var(--wrong);
  }
  .option-btn.wrong .option-letter { background:var(--wrong); color:#fff; }

  .option-btn:disabled { cursor: default; }

  .feedback-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
    min-height: 34px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .feedback-msg {
    font-weight: 700;
    font-size: .95rem;
    opacity: 0;
    transition: opacity .3s;
  }
  .feedback-msg.show { opacity:1; }
  .feedback-msg.ok { color: var(--correct); }
  .feedback-msg.bad { color: var(--wrong); }

  .next-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: .95rem;
    border: none;
    padding: 10px 26px;
    border-radius: 10px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: all .3s;
  }
  .next-btn.show { opacity:1; pointer-events:all; }
  .next-btn:hover { transform:scale(1.04); box-shadow:0 4px 15px rgba(59,130,246,.4); }

  /* ── RESULT SCREEN ── */
  #result-screen {
    text-align: center;
    gap: 24px;
  }

  .result-ring {
    position: relative;
    width: 160px;
    height: 160px;
  }
  .result-ring svg { transform: rotate(-90deg); }
  .ring-bg { fill:none; stroke:var(--border); stroke-width:10; }
  .ring-fill { fill:none; stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset 1s ease; }

  .result-center {
    position:absolute;
    inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .result-score-big {
    font-family:'Tajawal',sans-serif;
    font-weight:900;
    font-size:2.8rem;
    line-height:1;
  }
  .result-label { font-size:.8rem; color:var(--muted); margin-top:2px; }

  .result-title {
    font-family:'Tajawal',sans-serif;
    font-weight:900;
    font-size:1.8rem;
    color:var(--white);
  }
  .result-subtitle { color:var(--muted); font-size:.95rem; }

  .result-stats {
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .stat-box {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 24px;
    min-width:110px;
  }
  .stat-num { font-family:'Tajawal',sans-serif; font-weight:900; font-size:2rem; }
  .stat-lbl { font-size:.78rem; color:var(--muted); margin-top:2px; }
  .stat-box.c .stat-num { color:var(--correct); }
  .stat-box.w .stat-num { color:var(--wrong); }
  .stat-box.t .stat-num { color:var(--gold); }

  .result-btns {
    display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
  }
  .btn-outline {
    background:transparent;
    border:1.5px solid var(--border);
    color:var(--text);
    font-family:'Cairo',sans-serif;
    font-weight:700;
    padding:11px 26px;
    border-radius:10px;
    cursor:pointer;
    font-size:.95rem;
    transition:all .2s;
  }
  .btn-outline:hover { border-color:var(--accent); color:var(--accent); }

  .btn-primary {
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;
    color:#fff;
    font-family:'Cairo',sans-serif;
    font-weight:700;
    padding:11px 26px;
    border-radius:10px;
    cursor:pointer;
    font-size:.95rem;
    transition:all .2s;
  }
  .btn-primary:hover { transform:scale(1.04); box-shadow:0 4px 15px rgba(59,130,246,.4); }

  /* scrollbar */
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
</style>
</head>
<body>

<!-- HOME -->
<div id="home-screen" class="screen active">
  <div>
    <div class="logo-badge">المنشئ Z — Medicine</div>
    <h1 class="home-title">كويز الطب الشامل</h1>
    <p class="home-sub">١٠ مواضيع • ١٠ أسئلة لكل موضوع — اختر موضوعاً للبدء</p>
  </div>
  <div class="topics-grid" id="topics-grid"></div>
</div>

<!-- QUIZ -->
<div id="quiz-screen" class="screen">
  <div class="quiz-header">
    <div class="quiz-topic-label" id="quiz-topic-label"></div>
    <div class="quiz-progress-info" id="quiz-progress-info"></div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-bar"></div>
  </div>
  <div class="question-card" id="question-card">
    <div class="q-number" id="q-number"></div>
    <div class="q-text" id="q-text"></div>
    <div class="options-list" id="options-list"></div>
    <div class="feedback-row">
      <div class="feedback-msg" id="feedback-msg"></div>
      <button class="next-btn" id="next-btn">التالي ←</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="result-screen" class="screen">
  <div class="result-ring">
    <svg viewBox="0 0 160 160" width="160" height="160">
      <circle class="ring-bg" cx="80" cy="80" r="65"/>
      <circle class="ring-fill" id="ring-fill" cx="80" cy="80" r="65"
        stroke-dasharray="408.41" stroke-dashoffset="408.41"/>
    </svg>
    <div class="result-center">
      <div class="result-score-big" id="result-score-big"></div>
      <div class="result-label">النتيجة</div>
    </div>
  </div>
  <div class="result-title" id="result-title"></div>
  <div class="result-subtitle" id="result-subtitle"></div>
  <div class="result-stats">
    <div class="stat-box c"><div class="stat-num" id="stat-correct">0</div><div class="stat-lbl">✔ صحيح</div></div>
    <div class="stat-box w"><div class="stat-num" id="stat-wrong">0</div><div class="stat-lbl">✘ خطأ</div></div>
    <div class="stat-box t"><div class="stat-num" id="stat-total">0</div><div class="stat-lbl">إجمالي</div></div>
  </div>
  <div class="result-btns">
    <button class="btn-outline" id="retry-btn">إعادة الموضوع</button>
    <button class="btn-primary" id="home-btn">قائمة المواضيع</button>
  </div>
</div>

<script>
const TOPICS = [
  {

      { q: "Which phase of the human sexual response cycle is characterized by rhythmic contractions at the base of the penis resulting in ejaculation for men?", opts: ["Excitement","Plateau","Orgasm","Resolution"], ans: 2 },
      { q: "Which of the following is one of the pharmacological treatment in premature ejaculation?", opts: ["Concor","Systematic desensitization","SSRIs","Alprostadil"], ans: 2 },

      { q: "Which is true about sleep terror disorder?", opts: ["Occurs during REM sleep","Has memory of the arousal episode","Occurs during stage N3","Less common in children"], ans: 2 },

      { q: "Which of the following is NOT typically associated with OCD?", opts: ["Persistent and intrusive unwanted thoughts","Excessive fear of contamination or germs","Absence of intrusive thoughts regarding self-harm","Repetitive behaviors or mental acts performed in response to an obsession"], ans: 2 },
      { q: "Which of the following is the most common presentation of OCD in adults?", opts: ["Pathological doubt (e.g., checking compulsions)","Symmetry and precision","Intrusive sexual thoughts","Aggressive obsessions"], ans: 0 },

  },
  {
    name: "Addiction",
    nameAr: "الإدمان",

// State
let currentTopic = 0;
let currentQ = 0;
let score = 0;
let answered = false;
let completed = {};

const letters = ['A','B','C','D'];

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Build home
function buildHome() {
  const grid = document.getElementById('topics-grid');
  grid.innerHTML = '';
  TOPICS.forEach((t, i) => {
    const card = document.createElement('div');
    card.className = 'topic-card' + (completed[i] ? ' completed' : '');
    card.innerHTML = `
      <div class="topic-done">✓</div>
      <div class="topic-num">موضوع ${i+1}</div>
      <div class="topic-name">${t.nameAr}</div>
      <div class="topic-count">١٠ أسئلة</div>
    `;
    card.addEventListener('click', () => startTopic(i));
    grid.appendChild(card);
  });
  showScreen('home-screen');
}

function startTopic(i) {
  currentTopic = i;
  currentQ = 0;
  score = 0;
  answered = false;
  document.getElementById('quiz-topic-label').textContent = TOPICS[i].nameAr;
  showScreen('quiz-screen');
  renderQuestion();
}

function renderQuestion() {
  const topic = TOPICS[currentTopic];
  const q = topic.questions[currentQ];
  const total = topic.questions.length;

  document.getElementById('q-number').textContent = `سؤال ${currentQ + 1} من ${total}`;
  document.getElementById('quiz-progress-info').textContent = `${currentQ + 1} / ${total}`;
  document.getElementById('progress-bar').style.width = ((currentQ / total) * 100) + '%';
  document.getElementById('q-text').textContent = q.q;

  const list = document.getElementById('options-list');
  list.innerHTML = '';
  q.opts.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-text">${opt}</span><span class="option-letter">${letters[idx]}</span>`;
    btn.addEventListener('click', () => selectAnswer(idx, q.ans));
    list.appendChild(btn);
  });

  const fb = document.getElementById('feedback-msg');
  fb.className = 'feedback-msg';
  fb.textContent = '';
  const nb = document.getElementById('next-btn');
  nb.className = 'next-btn';
  nb.textContent = currentQ === topic.questions.length - 1 ? 'عرض النتيجة ✓' : 'التالي ←';
  answered = false;
}

function selectAnswer(idx, correct) {
  if (answered) return;
  answered = true;

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);

  if (idx === correct) {
    btns[idx].classList.add('correct');
    score++;
    const fb = document.getElementById('feedback-msg');
    fb.textContent = '✔ إجابة صحيحة!';
    fb.className = 'feedback-msg show ok';
  } else {
    btns[idx].classList.add('wrong');
    btns[correct].classList.add('correct');
    const fb = document.getElementById('feedback-msg');
    fb.textContent = '✘ إجابة خاطئة';
    fb.className = 'feedback-msg show bad';
  }

  document.getElementById('next-btn').className = 'next-btn show';
}

document.getElementById('next-btn').addEventListener('click', () => {
  const total = TOPICS[currentTopic].questions.length;
  if (currentQ < total - 1) {
    currentQ++;
    renderQuestion();
  } else {
    showResult();
  }
});

function showResult() {
  completed[currentTopic] = true;
  const total = TOPICS[currentTopic].questions.length;
  const pct = Math.round((score / total) * 100);

  document.getElementById('result-score-big').textContent = pct + '%';
  document.getElementById('stat-correct').textContent = score;
  document.getElementById('stat-wrong').textContent = total - score;
  document.getElementById('stat-total').textContent = total;

  let title, sub, color;
  if (pct >= 90) { title = '🏆 ممتاز!'; sub = 'أداء رائع جداً'; color = '#10b981'; }
  else if (pct >= 70) { title = '👍 جيد جداً!'; sub = 'استمر في التحسن'; color = '#3b82f6'; }
  else if (pct >= 50) { title = '📚 مقبول'; sub = 'راجع المادة مرة أخرى'; color = '#f59e0b'; }
  else { title = '💪 حاول مجدداً'; sub = 'لا تستسلم، كرر المراجعة'; color = '#ef4444'; }

  document.getElementById('result-title').textContent = title;
  document.getElementById('result-subtitle').textContent = sub;

  const ring = document.getElementById('ring-fill');
  ring.style.stroke = color;
  document.getElementById('result-score-big').style.color = color;

  showScreen('result-screen');
  const circumference = 408.41;
  setTimeout(() => {
    ring.style.strokeDashoffset = circumference - (circumference * pct / 100);
  }, 100);
}

document.getElementById('retry-btn').addEventListener('click', () => startTopic(currentTopic));
document.getElementById('home-btn').addEventListener('click', buildHome);

buildHome();
</script>
